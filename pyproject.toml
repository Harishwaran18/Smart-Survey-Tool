[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-survey-tool"
version = "1.0.0"
description = "AI-powered survey collection, analytics and insight platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Harishwaran" }]
keywords = ["survey", "analytics", "nlp", "sentiment-analysis", "nps", "streamlit", "fastapi"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "streamlit>=1.36",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pandas>=2.1",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "plotly>=5.20",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "sqlalchemy>=2.0",
  "openpyxl>=3.1",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
]

[project.optional-dependencies]
transformers = ["transformers>=4.40", "torch>=2.2"]
postgres = ["psycopg[binary]>=3.1"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.4",
  "mypy>=1.9",
]

[project.scripts]
smart-survey = "smart_survey.cli:main"

[project.urls]
Homepage = "https://github.com/Harishwaran18/Smart-Survey-Tool"
Issues = "https://github.com/Harishwaran18/Smart-Survey-Tool/issues"

[tool.setuptools.packages.find]
include = ["smart_survey*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["smart_survey"]
omit = ["smart_survey/ui/*", "smart_survey/cli.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".git", "__pycache__", "build", "dist", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "SIM", "RET", "ARG", "PTH", "PL"]
ignore = [
  "E501",
  "B008",
  "PLR0913",
  "PLR0912",
  "PLR0915",
  "PLR2004",
  "SIM108",
  "PLW0603",
  "UP038",
  "C408",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002", "PLR2004", "S101"]
"smart_survey/ui/*" = ["ARG001", "ARG002", "PLR0911"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
check_untyped_defs = true
exclude = ["tests/", "smart_survey/ui/"]
